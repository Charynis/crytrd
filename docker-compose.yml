services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable_freqai
    container_name: crytrd
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
    # FreqUI is only reachable from this laptop.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.json
      --strategy SwingFreqAI
      --freqaimodel LightGBMClassifier
